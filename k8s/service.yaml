# SFTPGo Services Configuration
#
# This file defines three services:
# 1. sftpgo-sftp (LoadBalancer) - SFTP/FTP access - REQUIRES static IP
# 2. sftpgo-web (LoadBalancer) - Web UI and WebDAV - Optional static IP
# 3. sftpgo-internal (ClusterIP) - Internal cluster access only
#
# Static IP Recommendations:
# - SFTP Service: REQUIRED - SFTP clients need consistent endpoint for firewall rules
# - Web Service: OPTIONAL - Can use ephemeral IP unless you need consistent URL
# - Internal Service: N/A - ClusterIP doesn't support external IPs
#
---
apiVersion: v1
kind: Service
metadata:
  name: sftpgo-sftp
  namespace: sftpgo
  labels:
    app: sftpgo
    project: sftpgo-gke
  annotations:
    cloud.google.com/load-balancer-type: "External"
    # GCP Load Balancer labels
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "sftpgo-backend-config"}'
spec:
  type: LoadBalancer

  # Static IP Configuration
  # 1. First, reserve a static IP using the script:
  #    ./scripts/reserve-static-ip.sh sftpgo-static-ip asia-southeast1
  #
  # 2. Get the reserved IP address:
  #    gcloud compute addresses describe sftpgo-static-ip \
  #      --region=asia-southeast1 \
  #      --format="get(address)"
  #
  # 3. Uncomment and set the IP below:
  # loadBalancerIP: "YOUR_STATIC_IP_ADDRESS"
  #
  # Examples:
  # loadBalancerIP: "34.87.123.45"      # Example IP in asia-southeast1
  # loadBalancerIP: "35.247.89.123"     # Example IP in asia-southeast1
  # loadBalancerIP: "34.142.56.78"      # Example IP in asia-southeast1

  externalTrafficPolicy: Local
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: sftp
    port: 22
    targetPort: 2022
    protocol: TCP
  - name: ftp
    port: 21
    targetPort: 2121
    protocol: TCP
  selector:
    app: sftpgo
---
apiVersion: v1
kind: Service
metadata:
  name: sftpgo-web
  namespace: sftpgo
  labels:
    app: sftpgo
    project: sftpgo-gke
  annotations:
    cloud.google.com/load-balancer-type: "External"
    # GCP Load Balancer labels
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: LoadBalancer

  # Optional: Static IP for Web Interface
  # If you want a separate static IP for the web interface:
  # 1. Reserve another static IP:
  #    ./scripts/reserve-static-ip.sh sftpgo-web-static-ip asia-southeast1
  #
  # 2. Uncomment and set the IP below:
  # loadBalancerIP: "YOUR_WEB_STATIC_IP_ADDRESS"
  #
  # Examples:
  # loadBalancerIP: "34.87.234.56"      # Example IP for web interface
  # loadBalancerIP: "35.247.123.89"     # Example IP for web interface
  #
  # Note: You can use ephemeral IP (leave commented) for web interface
  # if you don't need a consistent endpoint

  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: webdav
    port: 8090
    targetPort: 8090
    protocol: TCP
  selector:
    app: sftpgo
---
apiVersion: v1
kind: Service
metadata:
  name: sftpgo-internal
  namespace: sftpgo
  labels:
    app: sftpgo
    project: sftpgo-gke
spec:
  type: ClusterIP
  ports:
  - name: sftp
    port: 2022
    targetPort: 2022
    protocol: TCP
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: ftp
    port: 2121
    targetPort: 2121
    protocol: TCP
  - name: webdav
    port: 8090
    targetPort: 8090
    protocol: TCP
  selector:
    app: sftpgo
