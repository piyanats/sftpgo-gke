apiVersion: batch/v1
kind: CronJob
metadata:
  name: sftpgo-backup
  namespace: sftpgo
  labels:
    app: sftpgo-backup
    project: sftpgo-gke
spec:
  # Run daily at 2 AM Asia/Bangkok (19:00 UTC)
  schedule: "0 19 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400  # 24 hours
      template:
        metadata:
          labels:
            app: sftpgo-backup
            project: sftpgo-gke
        spec:
          serviceAccountName: sftpgo-backup
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: google/cloud-sdk:alpine
            command:
            - /bin/bash
            - -c
            - |
              set -e

              # Install PostgreSQL client
              apk add --no-cache postgresql-client

              # Copy backup script from mounted volume
              cp /backup/backup.sh /tmp/backup.sh
              chmod +x /tmp/backup.sh

              # Run backup
              /tmp/backup.sh

            env:
            # PostgreSQL credentials from secret
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: sftpgo-secrets
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: sftpgo-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: sftpgo-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sftpgo-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sftpgo-secrets
                  key: POSTGRES_PASSWORD

            # Backup configuration from ConfigMap
            - name: GCS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: sftpgo-config
                  key: GCS_BUCKET_NAME
            - name: RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: sftpgo-config
                  key: BACKUP_RETENTION_DAYS
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            # GCP credentials
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/gcs/credentials.json

            resources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi

            volumeMounts:
            - name: gcs-credentials
              mountPath: /secrets/gcs
              readOnly: true
            - name: backup-script
              mountPath: /backup
              readOnly: true

          volumes:
          - name: gcs-credentials
            secret:
              secretName: gcs-backup-credentials
          - name: backup-script
            configMap:
              name: backup-scripts
              defaultMode: 0755
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sftpgo-backup
  namespace: sftpgo
  labels:
    app: sftpgo-backup
    project: sftpgo-gke
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sftpgo-backup
  namespace: sftpgo
  labels:
    app: sftpgo-backup
    project: sftpgo-gke
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sftpgo-backup
  namespace: sftpgo
  labels:
    app: sftpgo-backup
    project: sftpgo-gke
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sftpgo-backup
subjects:
- kind: ServiceAccount
  name: sftpgo-backup
  namespace: sftpgo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  namespace: sftpgo
  labels:
    app: sftpgo-backup
    project: sftpgo-gke
data:
  backup.sh: |
    #!/bin/bash
    # This will be replaced by the actual backup script content
    # by the CI/CD pipeline or during deployment
    echo "Backup script placeholder"
