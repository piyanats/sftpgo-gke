apiVersion: v1
kind: Secret
metadata:
  name: sftpgo-secrets
  namespace: sftpgo
type: Opaque
stringData:
  # PostgreSQL connection details
  # IMPORTANT: Update these values before deploying
  POSTGRES_HOST: "your-postgresql-host.example.com"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "sftpgo"
  POSTGRES_USER: "sftpgo"
  POSTGRES_PASSWORD: "changeme-secure-password"

  # SFTPGo admin credentials
  SFTPGO_ADMIN_USERNAME: "admin"
  SFTPGO_ADMIN_PASSWORD: "changeme-admin-password"

  # Optional: JWT secret for API authentication
  SFTPGO_JWT_SECRET: "changeme-jwt-secret-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: gcs-backup-credentials
  namespace: sftpgo
type: Opaque
stringData:
  # GCP service account key for backup access
  # Create service account with Storage Admin role and download JSON key
  # Then base64 encode it: cat key.json | base64 -w 0
  credentials.json: |
    {
      "type": "service_account",
      "project_id": "your-project-id",
      "private_key_id": "key-id",
      "private_key": "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n",
      "client_email": "sftpgo-backup@your-project.iam.gserviceaccount.com",
      "client_id": "123456789",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/sftpgo-backup%40your-project.iam.gserviceaccount.com"
    }
